<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0f0d">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="주식 관망">
<title>내 주식 관망</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 기준 폭 390px, 간격 4·8·12·16·24·32만. 카드는 면 차이로 구분, 포인트 색은 라임 하나(채움 전용).
   등락은 국내 관례(빨강↑ 파랑↓)+부호. 다크가 기본, 밝은 화면 설정이면 밝은 판. */
:root {
  --bg: #0e0f0d; --card: #181a17; --card2: #22251f; --line: #2c2f29;
  --ink: #f2f4ee; --mute: #a2a89c; --dim: #747a70;
  --lime: #cdf54a; --lime-ink: #12150a; --mark: #cdf54a; --ma20: #cdf54a; --ma60: #8f958a;
  --up: #ff6161; --dn: #6a9cff; --res: #ff8f8f; --sup: #8fb4ff;
  --ease: cubic-bezier(.22, 1, .36, 1);
  color-scheme: dark;
}
/* 항상 다크(사용자 요청) — 휴대폰이 밝은 모드여도 같은 화면 */
* { box-sizing: border-box; margin: 0; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  font-size: 14px; line-height: 1.57; word-break: keep-all; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 600px; margin: 0 auto; padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 32px max(16px, env(safe-area-inset-left)); display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.card > *, .stocks > * { min-width: 0; }
.up { color: var(--up); } .dn { color: var(--dn); } .eq { color: var(--mute); }

/* 상단 */
.top { display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
.brand { font-weight: 800; letter-spacing: -.03em; font-size: 17px; display: flex; align-items: center; gap: 8px; }
.brand::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--mark); }
.stamp { color: var(--mute); font-size: 12px; }
.days { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px 4px; scroll-snap-type: x proximity; }
.days::-webkit-scrollbar { display: none; }
.day { flex: none; min-height: 44px; scroll-snap-align: start; border: 1px solid var(--line); background: var(--card); color: var(--mute); border-radius: 999px;
  padding: 0 16px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: background .25s var(--ease), color .25s var(--ease); }
.day[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* 공통 */
.card { background: var(--card); border-radius: 18px; padding: 16px; display: grid; gap: 12px; }
.label { color: var(--mute); font-size: 12px; font-weight: 600; letter-spacing: .01em; }
.sec { display: flex; align-items: center; justify-content: space-between; padding: 16px 0 0; min-height: 44px; }
.h2 { font-size: 18px; font-weight: 750; letter-spacing: -.03em; }
.h2 small { color: var(--dim); font-size: 12px; font-weight: 500; margin-left: 6px; letter-spacing: 0; }
.chip { display: inline-block; border-radius: 999px; padding: 4px 10px; background: var(--card2); font-size: 12px; font-weight: 500; color: var(--mute); }
.chip b { color: var(--ink); font-weight: 650; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip.delta { background: #252A25; min-height: 28px; display: inline-flex; align-items: center; }
.chip.warn { background: none; border: 1px solid var(--mark); color: var(--ink); }

/* 헤드라인 + 계좌 */
.headline { font-size: 20px; font-weight: 750; letter-spacing: -.04em; line-height: 1.35; text-wrap: balance; }
.hero { padding: 20px 16px 16px; position: relative; overflow: hidden; }
.hero .arrow { position: absolute; top: 12px; right: 12px; width: 44px; height: 44px; border-radius: 50%; background: var(--lime); color: var(--lime-ink); display: grid; place-items: center; }
.hero .arrow svg { width: 20px; height: 20px; }
.big { font-size: 40px; font-weight: 750; letter-spacing: -.05em; line-height: 1; }
.big small { font-size: 18px; font-weight: 600; margin-left: 2px; }
.kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.kv div { background: var(--card2); border-radius: 12px; padding: 8px 12px; }
.kv span { display: block; color: var(--mute); font-size: 11px; }
.kv b { font-size: 14px; font-weight: 700; }
.kv em { display: block; font-style: normal; font-size: 11px; color: #AEB8AD; margin-top: 2px; }
.spark svg { width: 100%; height: 56px; display: block; overflow: visible; }

/* 종목 카드 */
.toggle { display: inline-flex; background: var(--card); border-radius: 999px; padding: 2px; }
.toggle button { min-height: 40px; border: 0; background: none; color: var(--mute); font: inherit; font-size: 12px; font-weight: 650; padding: 0 12px; border-radius: 999px; cursor: pointer; transition: background .25s var(--ease), color .25s var(--ease); }
.toggle button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.stocks { display: grid; gap: 12px; }
.sHead { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: baseline; }
.sName { font-size: 17px; font-weight: 750; letter-spacing: -.03em; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.tone { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--card2); color: var(--mute); }
.tone.good { background: var(--lime); color: var(--lime-ink); }
.tone.bad { background: color-mix(in srgb, var(--up) 16%, transparent); color: var(--up); }
.sChg { font-size: 21px; font-weight: 700; letter-spacing: -.03em; text-align: right; }
.sMeta, .sPnl { color: var(--mute); font-size: 12px; }
.sMeta { grid-column: 1 / -1; }
.liveDot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--mark); margin: 0 4px 1px 2px; }
@media (prefers-reduced-motion: no-preference) { .liveDot { animation: blink 1.6s ease-in-out infinite; } @keyframes blink { 50% { opacity: .25; } } }
.sPrice { font-size: 14px; color: var(--mute); } .sPrice b { color: var(--ink); font-size: 16px; font-weight: 750; } .sPrice span { font-size: 12px; }
.sPnl { text-align: right; } .sPnl b { font-weight: 700; }
.chart svg { width: 100%; height: auto; display: block; }
.chart text { font: 600 10px "Pretendard Variable", sans-serif; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11px; color: var(--mute); }
.legend i { display: inline-block; width: 12px; height: 2px; vertical-align: middle; margin-right: 4px; border-radius: 2px; }
.gauge { display: grid; grid-template-columns: 40px 1fr 72px; gap: 8px; align-items: center; font-size: 12px; color: var(--mute); }
.gbar { position: relative; height: 6px; border-radius: 6px; background: linear-gradient(90deg, color-mix(in srgb, var(--dn) 55%, transparent) 0 30%, var(--card2) 30% 70%, color-mix(in srgb, var(--up) 55%, transparent) 70%); }
.gbar i { position: absolute; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 3px var(--card); }
.gauge b { color: var(--ink); font-weight: 700; text-align: right; }
.sub { font-size: 12px; font-weight: 700; color: var(--dim); }
.read { font-size: 14px; line-height: 1.6; }
.simple { font-size: 15px; font-weight: 650; line-height: 1.5; background: var(--card2); border-radius: 12px; padding: 12px; }
.simple::before { content: "한 줄로 보면"; display: block; font-size: 11px; font-weight: 700; color: var(--dim); margin-bottom: 2px; }
.seg { display: inline-flex; background: var(--card2); border-radius: 999px; padding: 2px; }
.seg button { min-height: 36px; border: 0; background: none; color: var(--mute); font: inherit; font-size: 12px; font-weight: 650; padding: 0 12px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.tfHead { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.tfBody { display: grid; gap: 12px; }
.prob { display: grid; gap: 8px; }
.pRow { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 4px 10px; align-items: center; font-size: 12px; }
.pRow > span { color: var(--mute); }
.stack { display: flex; height: 24px; border-radius: 8px; overflow: hidden; background: var(--card2); font-size: 11px; font-weight: 700; }
.stack i { display: flex; align-items: center; justify-content: center; font-style: normal; min-width: 0; white-space: nowrap; overflow: hidden; transition: flex-basis .4s var(--ease); }
.stack .u { background: color-mix(in srgb, var(--up) 70%, transparent); color: #fff; }
.stack .b { background: var(--line); color: var(--ink); }
.stack .d { background: color-mix(in srgb, var(--dn) 70%, transparent); color: #fff; }
.pKey { display: grid; gap: 4px; font-size: 13px; }
.pKey div { display: grid; grid-template-columns: 14px 1fr auto; gap: 8px; align-items: baseline; }
.pKey i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.pKey b { font-weight: 750; }
.pNote { font-size: 12px; color: var(--dim); line-height: 1.55; }
.pRow.dim .stack { opacity: .45; } .pRow small { font-size: 10px; color: var(--dim); }
.watchTop { display: grid; gap: 8px; }
.wt { display: grid; gap: 2px; min-height: 64px; background: var(--card); border-radius: 14px; padding: 12px; color: var(--ink); text-decoration: none;
  box-shadow: inset 3px 0 0 var(--mark); }
.wt b { font-size: 15px; } .wt > span { font-size: 13px; color: var(--mute); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
details.mid > summary { min-height: 44px; cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 650; color: var(--mute); }
details.mid > summary::-webkit-details-marker { display: none; }
details.mid > summary::after { content: ""; width: 8px; height: 8px; border-right: 2px solid var(--mark); border-bottom: 2px solid var(--mark);
  transform: rotate(45deg) translate(-2px, -2px); transition: transform .2s var(--ease); margin-right: 4px; }
details.mid[open] > summary::after { transform: rotate(-135deg) translate(-2px, -2px); }
details.mid > div { display: grid; gap: 12px; }
.keys { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.keyNow { grid-column: 1 / -1; font-size: 13px; color: var(--mute); }
.closed { grid-column: 1 / -1; font-size: 13px; color: var(--mute); background: var(--card2); border-radius: 12px; padding: 12px; }
.key { border-radius: 14px; padding: 12px; display: grid; gap: 2px; background: var(--card2); min-height: 84px; }
.key small { font-size: 12px; color: var(--dim); }
.key span { font-size: 12px; color: var(--mute); line-height: 1.4; }
.key strong { font-size: 23px; font-weight: 800; letter-spacing: -.03em; }
.oneProb small { font-size: 12px; color: var(--dim); }
.stack { height: 18px !important; border-radius: 6px !important; }
.key.u small b { color: var(--up); } .key.d small b { color: var(--dn); }
.oneProb { margin-top: 4px; }
.key.u { box-shadow: inset 0 3px 0 var(--up); } .key.d { box-shadow: inset 0 3px 0 var(--dn); }
.oneProb { grid-column: 1 / -1; display: grid; gap: 6px; font-size: 12px; color: var(--mute); }
.opKey { display: flex; justify-content: space-between; font-weight: 650; }
details.deep { border-top: 1px solid #303630; }
details.deep summary { min-height: 48px; width: 100%; cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: center; gap: 6px;
  font-size: 14px; font-weight: 700; color: var(--ink); }
details.deep summary::-webkit-details-marker { display: none; }
details.deep summary::after { content: "↓"; color: var(--mark); transition: transform .25s var(--ease); }
details.deep[open] summary::after { transform: rotate(180deg); }
.deepBody { display: grid; gap: 12px; padding-top: 4px; }
fieldset.q { border: 0; padding: 0; margin: 0; display: grid; gap: 4px; }
fieldset.q legend { font-size: 14px; font-weight: 650; margin-bottom: 4px; }
fieldset.q label { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 12px; border-radius: 10px; background: var(--card2); font-size: 14px; }
fieldset.q input { accent-color: var(--lime); width: 18px; height: 18px; }
a.chip { text-decoration: none; }
.gloss dt { font-weight: 700; margin-top: 12px; } .gloss dt:first-child { margin-top: 0; }
.gloss dd { margin: 2px 0 0; color: var(--mute); font-size: 13px; line-height: 1.6; }
.scen { display: grid; gap: 4px; }
.sc { display: grid; grid-template-columns: 48px 1fr; gap: 8px; background: var(--card2); border-radius: 12px; padding: 8px 12px; font-size: 14px; line-height: 1.5; }
.sc span { font-size: 12px; font-weight: 750; padding-top: 1px; }
.sc.u span { color: var(--up); } .sc.b span { color: var(--mute); } .sc.d span { color: var(--dn); }
.watch { display: grid; grid-template-columns: 8px 1fr; gap: 12px; align-items: start; border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-size: 14px; }
.watch::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--mark); margin-top: 7px; }
details.more { border-top: 1px solid var(--line); padding-top: 4px; }
details.more summary { min-height: 40px; cursor: pointer; list-style: none; color: var(--mute); font-size: 13px; font-weight: 650; display: flex; align-items: center; justify-content: space-between; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::after { content: "+"; font-size: 18px; font-weight: 500; transition: transform .25s var(--ease); }
details.more[open] summary::after { transform: rotate(45deg); }
details.more > div { display: grid; gap: 8px; padding-bottom: 4px; }
.risk { color: var(--mute); font-size: 13px; } .risk b { color: var(--ink); }

/* 시장 */
.flow { font-size: 14px; line-height: 1.65; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.kpi { background: var(--card2); border-radius: 12px; padding: 8px 12px; min-width: 0; }
.kpi .n { color: var(--mute); font-size: 11px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .v { font-size: 15px; font-weight: 700; letter-spacing: -.02em; display: block; }
.kpi .c { font-size: 12px; font-weight: 650; }
.bars { display: grid; gap: 8px; }
.bar { display: grid; grid-template-columns: 64px minmax(0, 1fr) 56px; gap: 8px; align-items: center; font-size: 13px; }
.track { position: relative; height: 20px; border-radius: 6px; background: var(--card2); }
.track::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; border-left: 1px dashed var(--dim); }
.track i { position: absolute; top: 4px; bottom: 4px; border-radius: 4px; }
.bar .c { text-align: right; font-weight: 650; }
.points { display: grid; gap: 8px; list-style: none; padding: 0; }
.points li { background: var(--card2); border-radius: 12px; padding: 12px; }
.pick { background: var(--lime); color: var(--lime-ink); border-radius: 12px; padding: 12px; font-weight: 650; }
.ev { display: grid; grid-template-columns: 56px 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.ev:first-of-type { border-top: 0; padding-top: 0; }
.ev .t { font-weight: 750; }
.ev .w { color: var(--mute); font-size: 12px; }
.src { display: grid; }
.src a { color: var(--mute); text-decoration: none; padding: 12px 24px 12px 0; border-top: 1px solid var(--line); position: relative; font-size: 13px; }
.src a::after { content: "↗"; position: absolute; right: 0; top: 12px; transition: transform .25s var(--ease); }
.src a:hover::after { transform: translate(2px, -2px); }
.foot { color: var(--dim); font-size: 12px; line-height: 1.6; padding-top: 8px; }

/* 모션: 첫 화면은 정지. 아래 카드만 스크롤해 들어올 때 한 번 올라온다(.motion-ready가 붙어야 숨김 → JS 없어도 보임) */
@media (prefers-reduced-motion: no-preference) {
  .motion-ready .rv { opacity: 0; transform: translateY(12px); transition: opacity .5s var(--ease), transform .5s var(--ease); }
  .motion-ready .rv.in { opacity: 1; transform: none; }
}
.lock { display: grid; gap: 12px; max-width: 360px; margin: 18vh auto 0; }
.lockT { color: var(--mute); }
.lockL { font-size: 12px; font-weight: 650; color: var(--mute); }
.lock input[type=password] { min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-size: 16px; padding: 0 14px; }
.lockR { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--mute); min-height: 44px; }
.lock button { min-height: 48px; border: 0; border-radius: 12px; background: var(--lime); color: var(--lime-ink); font: inherit; font-size: 15px; font-weight: 750; cursor: pointer; }
.lockE { color: var(--up); font-size: 13px; min-height: 1em; }
button:focus-visible, summary:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--mark); outline-offset: 2px; }
</style>
</head>

<script>
// 잠금: 데이터가 암호화돼 있으면 비밀번호로 푼다(PBKDF2-SHA256 → AES-256-GCM, brief.py encrypt와 짝)
async function decrypt(e, pw) {
  const b = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b(e.salt), iterations: e.iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b(e.iv) }, key, b(e.ct))));
}
let PW = null;  // 푼 비밀번호 — 실시간 파일(live.json)도 같은 비밀번호로 푼다
function unlock(e) {
  const KEY = 'brief-pw';
  const app = document.getElementById('app');
  return new Promise(async (done) => {
    let saved = null;
    try { saved = localStorage.getItem(KEY); } catch {}
    if (saved) { try { const d = await decrypt(e, saved); PW = saved; return done(d); } catch { try { localStorage.removeItem(KEY); } catch {} } }
    app.innerHTML = `<form class="lock" id="lock">
      <div class="brand">내 주식 관망</div>
      <p class="lockT">내 계좌 정보가 들어 있어 잠겨 있어요.</p>
      <label class="lockL" for="pw">비밀번호</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <label class="lockR"><input id="remember" type="checkbox" checked> 이 기기에서 기억하기</label>
      <button type="submit">열기</button>
      <p class="lockE" id="lockE" role="alert"></p></form>`;
    const form = document.getElementById('lock');
    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const pw = document.getElementById('pw').value;
      form.querySelector('button').textContent = '여는 중…';
      try {
        const data = await decrypt(e, pw);
        PW = pw;
        if (document.getElementById('remember').checked) { try { localStorage.setItem(KEY, pw); } catch {} }
        done(data);
      } catch {
        document.getElementById('lockE').textContent = '비밀번호가 맞지 않아요.';
        form.querySelector('button').textContent = '열기';
      }
    });
  });
}

(async () => {
  let A = JSON.parse(document.getElementById('data').textContent);
  if (A.__enc) A = await unlock(A.__enc);
  const ids = Object.keys(A).sort().reverse();
  const app = document.getElementById('app');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let cur = ids.includes(location.hash.slice(1)) ? location.hash.slice(1) : ids[0];
  let order = 'won';
  const SHORT = { '필라델피아반도체': 'SOX', '미 10년물': '미국10Y', '원/달러': 'USD/KRW' };

  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const dir = (v) => (v > 0 ? 'up' : v < 0 ? 'dn' : 'eq');
  const sgn = (v, d = 2) => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(d);
  const won = (v) => Math.round(v).toLocaleString('ko-KR');
  const swon = (v) => (v > 0 ? '+' : v < 0 ? '−' : '') + won(Math.abs(v)) + '원';
  const label = (id) => { const [y, m, d, k] = id.split('-');
    return `${+m}.${+d} ${'일월화수목금토'[new Date(+y, +m - 1, +d).getDay()]} ${k === 'am' ? '아침' : '오후'}`; };
  const arrowSvg = (up) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${
    up ? '<path d="M7 17L17 7M9 7h8v8"/>' : '<path d="M7 7l10 10M17 9v8H9"/>'}</svg>`;

  function spark() {
    const pts = ids.slice().reverse().map((id) => A[id].d.acct.pnl).filter((v) => v != null);
    if (pts.length < 2) return '';
    const W = 320, H = 56, lo = Math.min(...pts), hi = Math.max(...pts), span = hi - lo || 1;
    const xy = pts.map((v, i) => [i / (pts.length - 1) * W, 4 + (1 - (v - lo) / span) * (H - 8)]);
    const d = 'M' + xy.map((p) => p.map((n) => n.toFixed(1)).join(',')).join('L'), last = xy[xy.length - 1];
    return `<div class="spark"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="브리핑별 계좌 손익 추이">
      <path d="${d}L${W},${H}L0,${H}Z" fill="var(--lime)" opacity=".08"/>
      <path d="${d}" fill="none" stroke="var(--ma20)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="var(--ma20)"/></svg></div>`;
  }

  // 캔들 + 20·60일선 + 지지·저항 + 거래량. 이동평균은 받은 캔들로 계산(60일선은 60번째 봉부터).
  function candles(t, krw) {
    const B = t.ohlc || []; if (B.length < 10) return '';
    const W = 340, H = 176, V = 32, R = 50, n = B.length, cw = (W - R) / n;
    const lo = Math.min(...B.map((b) => b[3]), t.sup_lo ?? t.sup, t.invalid ?? t.sup), hi = Math.max(...B.map((b) => b[2]), t.res_hi ?? t.res);
    const pad = (hi - lo) * 0.06, y = (v) => 6 + (1 - (v - lo + pad) / (hi - lo + 2 * pad)) * (H - 12);
    const vmax = Math.max(...B.map((b) => b[5])) || 1;
    const fmt = (v) => (krw ? Math.round(v).toLocaleString('ko-KR') : v >= 100 ? v.toFixed(1) : v.toFixed(2));
    const ma = (k) => B.map((_, i) => (i + 1 < k ? null : B.slice(i + 1 - k, i + 1).reduce((s, b) => s + b[4], 0) / k));
    const line = (arr) => arr.map((v, i) => (v == null ? '' : `${arr[i - 1] == null ? 'M' : 'L'}${(i * cw + cw / 2).toFixed(1)},${y(v).toFixed(1)}`)).join('');
    let s = '';
    B.forEach((b, i) => {
      const [, o, h, l, c, vol] = b, x = i * cw + cw / 2, col = c >= o ? 'var(--up)' : 'var(--dn)';
      s += `<line x1="${x}" x2="${x}" y1="${y(h)}" y2="${y(l)}" stroke="${col}" stroke-width="1"/>`
        + `<rect x="${x - cw * 0.32}" width="${cw * 0.64}" y="${y(Math.max(o, c))}" height="${Math.max(1, Math.abs(y(o) - y(c)))}" fill="${col}"/>`
        + `<rect x="${x - cw * 0.32}" width="${cw * 0.64}" y="${H + V - vol / vmax * (V - 6)}" height="${vol / vmax * (V - 6)}" fill="${col}" opacity=".3"/>`;
    });
    const lvl = (v, name, col, dash = '3 3') => `<line x1="0" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="${col}" stroke-dasharray="${dash}"/>
      <text x="${W - R + 4}" y="${y(v) + 3}" fill="${col}">${name} ${fmt(v)}</text>`;
    const last = B[n - 1][4];
    // 스윙 고저를 묶은 지지·저항 구간(띠). 현재가 위는 저항색, 아래는 지지색
    const zones = (t.zones || []).map(([zl, zh]) => `<rect x="0" width="${W - R}" y="${y(zh) - 1}" height="${Math.max(2, y(zl) - y(zh) + 2)}"
      fill="${zl > last ? 'var(--res)' : 'var(--sup)'}" opacity=".13"/>`).join('')
      + (t.testing ? `<rect x="0" width="${W - R}" y="${y(t.testing[1]) - 1}" height="${Math.max(3, y(t.testing[0]) - y(t.testing[1]) + 2)}"
      fill="none" stroke="var(--mark)" stroke-width="1.2" stroke-dasharray="2 2"/>` : '');
    return `<div class="chart"><svg viewBox="0 0 ${W} ${H + V + 14}" role="img" aria-label="최근 ${n}일 일봉 차트">${zones}${s}
      <path d="${line(ma(20))}" fill="none" stroke="var(--ma20)" stroke-width="1.6"/>
      <path d="${line(ma(60))}" fill="none" stroke="var(--ma60)" stroke-width="1.4"/>
      ${lvl(t.res, t.res_n === 0 ? '저항*' : '저항', 'var(--res)')}${lvl(t.sup, t.sup_n === 0 ? '지지*' : '지지', 'var(--sup)')}${t.invalid != null ? lvl(t.invalid, '무효', 'var(--dim)', '1 3') : ''}
      <rect x="${W - R + 2}" y="${y(last) - 8}" width="${R - 2}" height="16" rx="4" fill="var(--ink)"/>
      <text x="${W - R + 5}" y="${y(last) + 3.5}" fill="var(--bg)">${fmt(last)}</text>
      <text x="0" y="${H + V + 12}" fill="var(--dim)">${B[0][0].replace('-', '.')}</text>
      <text x="${W - R}" y="${H + V + 12}" fill="var(--dim)" text-anchor="end">${B[n - 1][0].replace('-', '.')}</text></svg></div>
      <div class="legend"><span><i style="background:var(--ma20)"></i>최근 20일 평균가</span><span><i style="background:var(--ma60)"></i>60일 평균가</span>
        <span><i style="background:var(--res);height:6px;opacity:.5"></i>자주 막혔던 가격대</span><span><i style="background:var(--sup);height:6px;opacity:.5"></i>자주 받쳐 준 가격대</span>
        <span>회색 점선 · 여기 아래로 마감하면 분석이 틀린 것</span>
        ${t.testing ? '<span>연두 점선 상자 · 지금 시험 중인 가격대</span>' : ''}
        ${t.sup_n === 0 || t.res_n === 0 ? '<span>* 과거 가격대가 없어 흔들림 폭의 2배로 잡은 경계</span>' : ''}</div>`;
  }

  // 초보용 말풀이
  const EASY_STRUCT = { '고점·저점 상승': '점점 높아지는 중', '고점·저점 하락': '점점 낮아지는 중', '엇갈림': '방향이 엇갈림' };
  const EASY_WARN = { '강세 다이버전스 경고': '주가는 더 내렸는데 떨어지는 힘은 약해짐 → 반등 경고',
    '약세 다이버전스 경고': '주가는 더 올랐는데 오르는 힘은 약해짐 → 꺾임 경고',
    '가격 하락 중 OBV 상승(매집 괴리)': '가격은 내렸는데 사는 거래가 더 많았음 → 모으는 흔적일 수 있음',
    '가격 상승 중 OBV 하락(분산 괴리)': '가격은 올랐는데 파는 거래가 더 많았음 → 힘 빠짐 경고' };
  const easyFlow = (t) => (t.adx == null ? t.trend : t.adx > 25 ? (/상승/.test(t.regime) ? '뚜렷한 상승세' : '뚜렷한 하락세')
    : t.adx >= 20 ? (/상승/.test(t.regime) ? '약한 상승 기울기' : '약한 하락 기울기') : '방향 없이 오르내림');

  const TF = [['1d', '일봉'], ['60m', '60분'], ['30m', '30분'], ['5m', '5분']];
  let TOP2 = new Set(), PREV_AT = null;  // 비중 상위 2종목은 기준 가격·통계를 펼쳐 둔다
  const HOLD = {};  // 이름 → 종목 데이터 (탭 전환용)

  // 시간 단위별 차트 + 지표. 일봉은 h.tech, 분봉은 h.tf[단위]
  function tfBody(h, tf) {
    const t = tf === '1d' ? h.tech : (h.tf || {})[tf];
    if (!t) return `<p class="pNote">이 단위 데이터가 없습니다(거래가 적은 종목은 분봉이 비어 있을 수 있음).</p>`;
    const krw = /\.(KS|KQ)$/.test(h.ticker || '');
    const P = (v) => (krw ? Math.round(v).toLocaleString('ko-KR') + '원' : v);
    const unit = tf === '1d' ? '20일' : '20봉';
    const chips = [t.testing ? `지금 시험 중인 가격대 <b>${P(t.testing[0])}~${P(t.testing[1])}</b>` : '', `흐름 <b>${easyFlow(t)}</b>`, t.struct ? `고점·저점 <b>${EASY_STRUCT[t.struct] || t.struct}</b>` : '',
      t.dist_ma20 != null ? `${unit} 평균가보다 <b class="${dir(t.dist_ma20)}">${sgn(t.dist_ma20, 1)}%</b>` : '',
      t.atr_pct != null ? `${tf === '1d' ? '하루' : '한 봉'} 흔들림 폭 <b>${P(t.range_lo)}~${P(t.range_hi)}</b> (±${t.atr_pct}%)` : '',
      `단기 힘 <b>${t.macd_cross === '골든' ? '막 강해지기 시작' : t.macd_cross === '데드' ? '막 약해지기 시작' : t.macd_above ? '강해지는 쪽' : '약해지는 쪽'}</b>`,
      t.from_hi != null ? `1년 최고가보다 <b>${sgn(t.from_hi, 1)}%</b>` : '',
      t.rs != null ? `${krw ? '코스닥' : '나스닥'}보다 20일간 <b class="${dir(t.rs)}">${sgn(t.rs, 1)}% ${t.rs >= 0 ? '강함' : '약함'}</b>` : '',
      t.vol_x != null ? `거래량 평소의 <b>${t.vol_x}배</b>` : ''].filter(Boolean);
    const warns = [EASY_WARN[t.div] || '', t.squeeze ? '가격 폭이 좁아짐 → 곧 크게 움직일 수 있음' : '', EASY_WARN[t.obv] || ''].filter(Boolean);
    return `${candles(t, krw)}
      <div class="gauge"><span>온도계</span><div class="gbar"><i style="left:${t.rsi}%"></i></div><b>${t.rsi} ${t.rsi <= 30 ? '많이 식음' : t.rsi >= 70 ? '과열' : '보통'}</b></div>
      <div class="chips">${chips.map((c) => `<span class="chip">${c}</span>`).join('')}</div>
      ${warns.length ? `<div class="chips">${warns.map((w) => `<span class="chip warn">${esc(w)}</span>`).join('')}</div>` : ''}`;
  }

  // 시나리오별 가능성: 차트 기준(과거 통계) vs 전망 반영(실험적)
  function probBody(h, n) {
    const p = h.prob; if (!p) return '';
    const c = p.h[n], o = (p.outlook || {})[n];
    const lv = p.levels, krw = /\.(KS|KQ)$/.test(p.inst || '');
    const P = (v) => (krw ? Math.round(v).toLocaleString('ko-KR') + '원' : v + '달러');
    const bar = (x) => `<div class="stack">${[['u', x.up], ['b', x.base], ['d', x.dn]].map(([k, v]) =>
      `<i class="${k}" style="flex-basis:${v}%">${v >= 9 ? v + '%' : ''}</i>`).join('')}</div>`;
    const who = h.base ? `${esc(h.base)}(이 ETF가 따라가는 주식) ` : '';
    return `<div class="prob">
      <div class="pKey">
        <div><i style="background:var(--up)"></i><span>${who}종가가 <b>${P(lv.up)}</b> 위로 먼저</span><b class="up">${c.up}%</b></div>
        <div><i style="background:var(--line)"></i><span>${n}거래일 동안 둘 다 안 닿음</span><b>${c.base}%</b></div>
        <div><i style="background:var(--dn)"></i><span>종가가 <b>${P(lv.dn)}</b> 아래로 먼저</span><b class="dn">${c.dn}%</b></div>
      </div>
      <div class="pRow"><span>차트 기준</span>${bar(c)}</div>
      ${c.up_rng ? `<p class="pNote">참고 범위(표본 크기에 따른 흔들림): 위 ${c.up_rng[0]}~${c.up_rng[1]}%, 아래 ${c.dn_rng[0]}~${c.dn_rng[1]}%</p>` : ''}
      ${o ? `<div class="pRow dim"><span>전망 반영<br><small>검증 전</small></span>${bar(o)}</div>` : ''}
      ${o && o.factors.length ? `<div class="chips">${o.factors.map((f) => `<span class="chip">${esc(f)}</span>`).join('')}</div>` : ''}
      <p class="pNote">차트 기준: 지난 2년 중 지금과 같은 거리(하루 흔들림 폭 기준)에 위·아래 가격이 있던 날, ${n}거래일 안에 어느 쪽에 먼저 닿았는지 센 비율입니다.
        기간이 겹치지 않게 센 표본 ${c.n_eff}회(겹침 포함 ${c.n_all ?? '–'}회)를 같은 시장의 다른 보유 종목·지수 통계로 보정했습니다${c.regime_used ? ', 지금과 같은 흐름 강도의 날만 골랐습니다' : ''}.${c.thin ? ' <b>표본이 적어 참고용입니다.</b>' : ''}
        전망 반영: 그 숫자에 뉴스·지수 흐름·희석 이슈·실적 일정을 정해진 한도 안에서 더한 값으로, 예측 기록을 채점해 효과가 확인되기 전까지는 검증 전입니다. 둘 다 과거 통계이며 앞일을 보장하지 않습니다.</p>
    </div>`;
  }

  // 그 시장이 지금 열려 있나(한국 시각). 국내 평일 09:00~15:30, 미국 22:30~06:00(서머타임 차이는 넉넉히 포함). 공휴일은 모름
  function marketOpen(kr) {
    const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: 'Asia/Seoul', weekday: 'short', hour: '2-digit', minute: '2-digit', hour12: false })
      .formatToParts(new Date()).map((x) => [x.type, x.value]));
    const wd = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].indexOf(p.weekday), m = (+p.hour % 24) * 60 + +p.minute;
    if (kr) return wd >= 1 && wd <= 5 && m >= 540 && m <= 930;
    return (wd >= 1 && wd <= 5 && m >= 1350) || (wd >= 2 && wd <= 6 && m <= 360);
  }

  // 초보용 기본 화면: 기억할 가격 두 개 + 한 달 안에 어느 쪽에 먼저 닿았나(과거 비슷한 경우)
  function keyView(h) {
    const p = h.prob; if (!p) return h.tech ? '<p class="pNote">가격 기록이 부족하거나 이상해서 이 종목은 확률을 내지 않았어요.</p>' : '';
    const T = h.base ? h.base_tech : h.tech, kr = /\.(KS|KQ)$/.test(p.inst || '');
    const P = (v) => (kr ? Math.round(v).toLocaleString('ko-KR') + '원' : v + '달러');
    const c = p.h['20'];
    const seg = (cls, v) => `<i class="${cls}" style="flex-basis:${v}%">${v >= 12 ? v + '%' : ''}</i>`;
    const who = h.base ? `${esc(h.base)} 기준` : '종가 기준';
    const open = marketOpen(kr);  // 장이 열려 있을 때만 '오늘 마감하면' 문구
    return `<div class="keys">
      ${h.base ? `<p class="keyNow">이 ETF는 <b>${esc(h.base)}</b>의 하루 등락률 약 2배를 목표로 해요. 아래 가격은 ${esc(h.base)} 기준(지금 ${P(T.price)})</p>` : ''}
      ${open ? `<div class="key u"><small>${who} · <b>위쪽 기준</b></small><strong>${P(p.levels.up)}</strong><span>오늘 이 가격 위로 마감하는지</span></div>
      <div class="key d"><small>${who} · <b>아래쪽 기준</b></small><strong>${P(p.levels.dn)}</strong><span>오늘 이 가격 아래로 마감하는지</span></div>`
        : `<p class="closed">${kr ? '국내' : '미국'} 장이 닫혀 있어요 · 위·아래 기준 가격은 다음 장이 열리면 보여요</p>`}
      <div class="oneProb"><span>과거에 지금과 비슷했을 때, 20거래일 안에 종가로 먼저 넘은 쪽</span>
        <div class="stack">${seg('u', c.up)}${seg('b', c.base)}${seg('d', c.dn)}</div>
        <div class="opKey"><span class="up">위쪽 먼저 ${c.up}%</span><span>둘 다 아님 ${c.base}%</span><span class="dn">아래쪽 먼저 ${c.dn}%</span></div>
        <small>과거 ${c.n_eff}구간 · 비슷한 종목 통계로 보정한 비율 · 20거래일 · 종가 기준 · 미래 예측 아님</small></div>
    </div>`;
  }

  const stampOf = (d) => { const [y, m, dd] = d.id.split('-'); return `${+m}.${+dd}(${'일월화수목금토'[new Date(+y, +m - 1, +dd).getDay()]}) ${d.at.slice(11, 16)}`; };

  // 첫 화면 '오늘 지켜볼 것' 2개: 오늘 가장 크게 움직인 두 종목의 지켜볼 것 — 누르면 그 종목 카드로
  function watchTop(d, views) {
    // 계좌 영향이 가장 큰 종목 1개(평가금×오늘 등락) + 확인할 사건(실적 일정)이 있는 종목 1개
    const has = d.hold.filter((h) => views[h.name]?.watch);
    const impact = has.slice().sort((x, y) => Math.abs(y.won * y.chg) - Math.abs(x.won * x.chg))[0];
    const evNames = new Set((d.earnings || []).map((e) => e.name));
    const ev = has.find((h) => h !== impact && evNames.has(h.name)) || has.filter((h) => h !== impact).sort((x, y) => Math.abs(y.won * y.chg) - Math.abs(x.won * x.chg))[0];
    const top = [impact, ev].filter(Boolean);
    if (!top.length) return '';
    const anyOpen = marketOpen(true) || marketOpen(false);
    return `<section class="watchTop"><div class="label">${anyOpen ? '오늘 지켜볼 것' : '다음 거래일에 지켜볼 것'}</div>${top.map((h) =>
      `<a class="wt" href="#s-${encodeURIComponent(h.name)}" data-jump="${esc(h.name)}"><b>${esc(h.name)} <span class="${dir(h.chg)}">${sgn(h.chg)}%</span></b><span>${esc(views[h.name].watch)}</span></a>`).join('')}</section>`;
  }

  let CUR_D = null;
  const md = (s) => `${+s.slice(5, 7)}/${+s.slice(8, 10)}`;
  // 카드 기본 화면 경고: 최근 7일 위험 공시, 20거래일 안 실적 발표(+과거 반응)
  function alerts(h) {
    const out = [];
    const wk = new Date(Date.now() - 7 * 864e5).toISOString().slice(0, 10);
    (h.filings || []).filter((f) => f.risky && f.date >= wk).slice(0, 1).forEach((f) =>
      out.push(`<a class="chip warn" href="${esc(f.url)}" target="_blank" rel="noopener">최근 공시 · ${esc(f.title)} (${md(f.date)})</a>`));
    const e = (CUR_D?.earnings || []).find((x) => x.name === h.name);
    if (e) out.push(`<span class="chip warn">실적 발표 ${md(e.date)}${h.earn_react ? ` · 지난 발표 다음 날 평균 ±${h.earn_react.avg_abs}%` : ''}</span>`);
    return out.length ? `<div class="chips">${out.join('')}</div>` : '';
  }
  // 자세히 보기: 수급·공시·지난 실적 반응
  function extraFacts(h) {
    let s = '';
    const f = h.flows, n = (x) => (x > 0 ? '+' : x < 0 ? '−' : '') + Math.abs(x).toLocaleString('ko-KR') + '주';
    if (f) s += `<div class="sub">최근 ${f.days}거래일 누가 샀나 (순매수)</div><div class="chips">
      <span class="chip">외국인 <b class="${dir(f.foreign)}">${n(f.foreign)}</b></span><span class="chip">기관 <b class="${dir(f.organ)}">${n(f.organ)}</b></span>
      <span class="chip">개인 <b class="${dir(f.indiv)}">${n(f.indiv)}</b></span>${f.foreign_ratio ? `<span class="chip">외국인 보유율 <b>${esc(f.foreign_ratio)}</b></span>` : ''}</div>`;
    if (h.earn_react) s += `<div class="sub">지난 실적 발표 다음 날 움직임${h.base ? ` (${esc(h.base)})` : ''}</div><div class="chips">${h.earn_react.items.map((x) =>
      `<span class="chip">${md(x.date)} <b class="${dir(x.move)}">${sgn(x.move, 1)}%</b></span>`).join('')}<span class="chip">평균 <b>±${h.earn_react.avg_abs}%</b></span></div>`;
    if ((h.filings || []).length) s += `<div class="sub">최근 2주 공시${h.base ? ` (${esc(h.base)})` : ''}</div><div class="src">${h.filings.map((x) =>
      `<a href="${esc(x.url)}" target="_blank" rel="noopener">${md(x.date)} · ${esc(x.title)}${x.risky ? ' · 주의' : ''}</a>`).join('')}</div>`;
    return s;
  }

  // 주간 정리(금요일 오후 브리핑)
  function weeklyCard(d, note) {
    const w = d.weekly; if (!w) return '';
    const nw = note.weekly || {};
    const top = w.holds.filter((x) => x.chg5 != null);
    return `<section class="card"><div class="label">이번 주 정리${w.from ? ` · ${label(w.from)}부터` : ''}</div>
      ${w.pnl_from != null ? `<p>계좌 손익률 <b>${sgn(w.pnl_from, 1)}%</b> → <b class="${dir(w.pnl_to - w.pnl_from)}">${sgn(w.pnl_to, 1)}%</b> · 평가금 ${swon(w.total_to - w.total_from)}</p>` : ''}
      ${top.length ? `<div class="chips">${top.slice(0, 2).map((x) => `<span class="chip">이번 주 강했던 ${esc(x.name)} <b class="${dir(x.chg5)}">${sgn(x.chg5, 1)}%</b></span>`).join('')}
        ${top.slice(-2).reverse().map((x) => `<span class="chip">약했던 ${esc(x.name)} <b class="${dir(x.chg5)}">${sgn(x.chg5, 1)}%</b></span>`).join('')}</div>` : ''}

  // 예측 채점: 낮을수록 정확(아무렇게나 찍으면 약 0.667)
  function scoreCard(d) {
    const s = d.scores, r = s && s['20'], f = s && s['5'];
    const row = (x, name) => x && x.n ? `<div class="pKey"><div><i style="background:var(--mark)"></i><span>${name} · 채점 ${x.n}건</span><b></b></div>

      ${row(f, '5거래일') + row(r, '20거래일') || '<p class="pNote">첫 채점은 예측이 5거래일 지난 뒤부터 나와요. 점수는 낮을수록 정확하고, 아무렇게나 찍으면 약 0.667이에요.</p>'}

  // 투자 성향 간이 진단 + 포트폴리오 점검(사실 비교만, 매매 추천 없음). 답은 이 기기에만 저장
  const QS = [['투자 경험은 얼마나 됐나요?', ['처음', '1년 미만', '1~3년', '3~5년', '5년 이상']],
    ['투자 목적은?', ['원금 지키기', '예금 이자 정도', '시장 평균 정도', '높은 수익', '큰 손실을 감수하고 큰 수익']],
    ['한 번에 견딜 수 있는 손실은?', ['손실은 싫음', '−10%까지', '−20%까지', '−40%까지', '그 이상도']],
    ['이 돈을 얼마나 묻어 둘 수 있나요?', ['6개월 미만', '1년', '1~3년', '3~5년', '5년 이상']],
    ['주식·ETF 구조를 얼마나 아나요?', ['거의 모름', '조금', '보통', '꽤 앎', '잘 앎']],
    ['전체 재산 중 투자금 비중은?', ['50% 이상', '30~50%', '20~30%', '10~20%', '10% 미만']]];
  const TYPES = [[10, '안정형', '6등급(매우 낮은 위험)'], [15, '안정추구형', '5등급 이하'], [20, '위험중립형', '4등급 이하'],
    [25, '적극투자형', '2등급 이하'], [99, '공격투자형', '1등급까지']];
  function profileCard(d) {
    let ans = [];
    try { ans = JSON.parse(localStorage.getItem('brief-profile') || '[]'); } catch {}
    const a = d.acct, tw = d.hold.reduce((s, h) => s + h.won, 0) || 1;
    const lev = d.hold.filter((h) => h.base).reduce((s, h) => s + h.won, 0) / tw * 100;
    const top = (a.groups || []).slice().sort((x, y) => y.weight - x.weight)[0];
    const need = a.pnl != null && a.pnl < 0 ? (1 / (1 + a.pnl / 100) - 1) * 100 : null;
    const score = ans.length === QS.length ? ans.reduce((s, x) => s + x + 1, 0) : null;
    const type = score && TYPES.find(([m]) => score <= m);
    return `<section class="card rv" id="profile"><div class="label">내 투자 성향 · 포트폴리오 점검</div>
      <div class="chips"><span class="chip">고위험 상품 비중 <b>100%</b></span><span class="chip">2배 ETF 비중 <b>${lev.toFixed(1)}%</b></span>
        ${top ? `<span class="chip">한 묶음 최대 <b>${esc(top.inst)} ${top.weight}%</b></span>` : ''}
        ${need ? `<span class="chip">원금 회복에 필요한 수익률 <b>+${need.toFixed(0)}%</b></span>` : ''}</div>
      <p class="pNote">보유 종목은 개별 주식·단일 종목 2배 ETF라 국내 표준 분류상 대부분 '매우 높은 위험(1등급)' 상품이에요(증권사마다 조금씩 다름). 손실 ${a.pnl != null ? sgn(a.pnl, 1) + '%' : ''}에서 원금까지는 +${need ? need.toFixed(0) : '–'}%가 필요해요 — 잃은 비율보다 되찾아야 할 비율이 더 큽니다.</p>
      <details class="mid"><summary>${type ? `내 성향: ${type[1]} · 다시 진단하기` : '간이 투자 성향 진단 (6문항)'}</summary><div>
        ${type ? `<p class="simple">${type[1]} — 표준 기준상 ${type[2]} 상품이 성향에 맞는 범위예요. 지금 계좌는 1등급 상품이 대부분이라 ${type[1] === '공격투자형' ? '성향 범위 안이에요.' : '성향보다 위험이 높은 쪽이에요.'}</p>` : ''}
        ${QS.map(([q, os], i) => `<fieldset class="q"><legend>${i + 1}. ${q}</legend>${os.map((o, j) =>
          `<label><input type="radio" name="q${i}" value="${j}" ${ans[i] === j ? 'checked' : ''}> ${o}</label>`).join('')}</fieldset>`).join('')}
        <p class="pNote">간이 진단이라 증권사 정식 설문과 다를 수 있어요. 답은 이 휴대폰에만 저장돼요. 매매 추천은 하지 않아요.</p>
      </div></details>
      <details class="mid"><summary>운용 원칙 기초</summary><div class="gloss"><dl>
        <dt>한 바구니에 몰지 않기(분산)</dt><dd>같은 주식을 따라가는 종목은 함께 움직여요. 묶음 비중이 클수록 한 종목 소식에 계좌 전체가 흔들립니다.</dd>
        <dt>손실 회복의 비대칭</dt><dd>−20%는 +25%, −50%는 +100%가 있어야 원금이에요. 큰 손실일수록 회복이 어려워집니다.</dd>
        <dt>2배 ETF는 오래 들수록 불리할 수 있음</dt><dd>하루 등락의 2배를 매일 다시 맞추기 때문에, 오르내림이 반복되면 따라가는 주식이 제자리여도 값이 줄어들 수 있어요.</dd>
        <dt>생활비와 투자금 분리</dt><dd>당장 쓸 돈으로 투자하면 손실 구간에서 원치 않게 팔아야 할 수 있어요.</dd>
        <dt>산 이유와 다시 볼 조건 적어 두기</dt><dd>"왜 샀는지, 어떤 일이 생기면 다시 판단할지"를 적어 두면 감정적인 결정을 줄일 수 있어요.</dd>
      </dl></div></details></section>`;
  }

  function stock(h, v, totalW) {
    HOLD[h.name] = h;
    const t = h.tech, sc = v.scenario || {}, b = h.base_tech;

    return `<article class="card rv" id="s-${encodeURIComponent(h.name)}">

        <div class="sName">${esc(h.name)}${v.tone ? `<span class="tone ${tone}">${esc(v.tone)}</span>` : ''}</div>

        <div class="sPnl">${h.pnl == null ? '원금 미입력' : `손익 <b class="${dir(h.pnl)}">${sgn(h.pnl, 1)}%</b>`}</div>

      ${(h.delta || []).length && PREV_AT ? `<div class="chips"><span class="chip delta">${esc(PREV_AT)} 브리핑 대비 · ${esc(h.delta[0])}</span></div>` : ''}
      <details class="mid"${TOP2.has(h.name) ? ' open' : ''}><summary>위·아래 기준 가격과 과거 통계</summary><div>

      </div></details>
      <details class="deep"><summary>차트와 자세한 분석 보기</summary><div class="deepBody">
      ${t ? `<div class="tfHead"><span class="sub">차트</span><div class="seg" role="group" aria-label="차트 단위">${TF.map(([k, n]) =>
        `<button data-tf="${k}" data-name="${esc(h.name)}" aria-pressed="${k === '1d'}">${n}</button>`).join('')}</div></div>
        <div class="tfBody">${tfBody(h, '1d')}</div>` : ''}
      ${b ? `<div class="chips"><span class="chip">이 ETF가 따라가는 ${esc(h.base)}: 흐름 <b>${easyFlow(b)}</b> · 받쳐 준 가격대 <b>${b.sup_lo ?? b.sup}~${b.sup}</b> · 막혔던 가격대 <b>${b.res}~${b.res_hi ?? b.res}</b></span></div>` : ''}
      ${v.chart ? `<div class="sub">차트 해석</div><p class="read">${esc(v.chart)}</p>` : ''}
      ${h.prob ? `<div class="tfHead"><span class="sub">시나리오별 가능성</span><div class="seg" role="group" aria-label="기간">
        <button data-pn="20" data-name="${esc(h.name)}" aria-pressed="true">20일(약 한 달)</button><button data-pn="5" data-name="${esc(h.name)}" aria-pressed="false">5일(일주일)</button></div></div>

      ${sc.up || sc.base || sc.down ? `<div class="sub">시나리오</div><div class="scen">

      ${extraFacts(h)}

        ${v.risk ? `<p class="risk"><b>위험</b> ${esc(v.risk)}</p>` : ''}` : ''}
      </div></details>
    </article>`;
  }

        <div class="grid3">${d.market.slice(3).map(kpi).join('')}</div>
        <div class="label">${d.kind === 'am' ? '미국' : '국내'} 업종별 등락 · 전일 대비</div>
        <div class="bars">${d.sector.map((s) => `<div class="bar"><span>${esc(s.name)}</span><div class="track"><i style="${s.chg >= 0 ? 'left' : 'right'}:50%;width:${(Math.abs(s.chg) / mx * 50).toFixed(1)}%;background:var(--${dir(s.chg) === 'eq' ? 'mute' : dir(s.chg)})"></i></div><span class="c ${dir(s.chg)}">${sgn(s.chg, 1)}%</span></div>`).join('')}</div>
        </div></details>
      </section>

      ${(note.points || []).length || note.pick ? `<section class="card rv"><div class="label">관망 포인트</div>
        <ul class="points">${(note.points || []).map((p) => `<li>${esc(p)}</li>`).join('')}</ul>
        ${note.pick ? `<div class="pick">관심 섹터 · ${esc(note.pick)}</div>` : ''}</section>` : ''}
      ${evs.length ? `<section class="card rv"><div class="label">다가오는 일정</div><div>${evs.map(([t, n, w]) => `<div class="ev"><span class="t">${esc(t)}</span><div><div>${esc(n)}</div>${w ? `<div class="w">${esc(w)}</div>` : ''}</div></div>`).join('')}</div></section>` : ''}
      ${note.review ? `<section class="card rv"><div class="label">지난 관망 점검</div><p>${esc(note.review)}</p></section>` : ''}
      ${(note.sources || []).length ? `<section class="card rv"><div class="label">근거 기사</div><div class="src">${note.sources.map((s) => /^https?:/.test(s.url || '')
        ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>` : `<span>${esc(s.title)}</span>`).join('')}</div></section>` : ''}
      ${scoreCard(d)}
      ${profileCard(d)}
      <section class="card rv" id="glossary"><div class="label">용어 풀이</div><dl class="gloss">
        <dt>20일·60일 평균가 (이동평균선)</dt><dd>최근 20일(약 한 달), 60일(약 석 달) 종가의 평균. 주가가 이 선 위에 있으면 최근 산 사람들이 대체로 이익, 아래면 손해인 상태입니다.</dd>
        <dt>자주 받쳐 준 / 막혔던 가격대 (지지·저항)</dt><dd>과거에 여러 번 떨어지다 멈추거나(받쳐 줌) 오르다 멈춘(막힘) 가격대. 이 구간을 종가로 뚫으면 흐름이 바뀌었다는 신호로 봅니다.</dd>
        <dt>흐름 (추세 강도, ADX)</dt><dd>오르든 내리든 한 방향으로 얼마나 꾸준히 가는지. '방향 없이 오르내림'이면 위아래로 출렁이는 박스권입니다.</dd>
        <dt>고점·저점</dt><dd>최근에 꺾였던 꼭대기와 바닥이 점점 높아지면 상승, 낮아지면 하락 흐름입니다.</dd>
        <dt>온도계 (RSI)</dt><dd>최근 오른 힘과 내린 힘의 비율, 0~100. 30 아래는 많이 식음(많이 빠짐), 70 위는 과열(많이 오름). 다만 강한 흐름에서는 한동안 계속 그 상태일 수 있습니다.</dd>
        <dt>하루 흔들림 폭 (ATR)</dt><dd>최근 14일 동안 하루에 평균적으로 움직인 폭. 이 범위 안의 출렁임은 평소 수준입니다.</dd>
        <dt>단기 힘 (MACD)</dt><dd>짧은 평균과 긴 평균의 차이로 본 오르는 힘·내리는 힘의 변화.</dd>
        <dt>코스닥·나스닥보다 강함/약함 (상대강도)</dt><dd>최근 20일 동안 지수보다 더 올랐는지(강함) 덜 올랐는지(약함).</dd>
        <dt>위쪽 기준 · 아래쪽 기준</dt><dd>과거에 자주 막혔던(위) / 받쳐 줬던(아래) 가격대에서 뽑은 기준선. 그 가격을 장 마감 가격으로 넘거나 깨면 흐름이 바뀌었을 가능성을 살펴볼 때입니다. 사고팔라는 신호가 아닙니다.</dd>
        <dt>시나리오</dt><dd>"이 가격 위·아래에서 장을 마치면 이렇게 흘러갈 수 있다"는 조건별 정리. 회색 점선 아래로 마감하면 기존 분석이 틀린 것으로 보고 새로 봐야 합니다.</dd>
        <dt>2배 레버리지 ETF의 손실</dt><dd>단일 종목 2배 ETF는 따라가는 주식의 하루 등락을 2배로 움직입니다. 오르내림이 반복되면 따라가는 주식이 제자리여도 ETF는 조금씩 줄어듭니다(출렁임으로 인한 손실 추정 — 따라가는 주식과 비교한 한 달치 대략값).</dd>
        <dt>공매도 비율</dt><dd>주식을 빌려 판 물량의 비율. 높을수록 하락에 베팅한 사람이 많고, 반대로 급등할 때 더 크게 튈 수도 있습니다.</dd>
      </dl></section>
      <p class="foot">시세 Yahoo Finance · 뉴스 Google News · 보유 종목은 토스증권 보유 현황을 옮겨 적은 값. 차트 해석과 시나리오는 지표에 근거한 조건별 정리이며 매매 권유가 아닙니다. 판단과 책임은 본인에게 있습니다.</p>`;
    reveal();
  }

  // 스크롤해 들어오는 카드만 한 번 올라온다
  let io;
  function reveal() {
    if (reduce || !('IntersectionObserver' in window)) return;
    document.documentElement.classList.add('motion-ready');
    io?.disconnect();
    io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -8% 0px' });
    app.querySelectorAll('.rv').forEach((el) => io.observe(el));
  }

  // 실시간: 장중 10분마다 PC가 올리는 live.json을 2분마다 확인해 최신 브리핑의 현재가·분봉만 바꾼다
  let liveAt = null;
  function rerender() {
    const st = {};
    app.querySelectorAll('article[id^="s-"]').forEach((a) => {
      st[a.id] = { deep: a.querySelector('details.deep')?.open, mid: a.querySelector('details.mid')?.open,
        tf: a.querySelector('[data-tf][aria-pressed="true"]')?.dataset.tf, pn: a.querySelector('[data-pn][aria-pressed="true"]')?.dataset.pn };
    });
    const outer = [...app.querySelectorAll('section details')].filter((x) => !x.closest('article')).map((x) => x.open);  // 시장 섹션 등
    const y = scrollY;
    render();
    app.querySelectorAll('.rv').forEach((el) => el.classList.add('in'));  // 다시 그릴 땐 등장 효과 없이
    app.querySelectorAll('article[id^="s-"]').forEach((a) => {
      const s = st[a.id]; if (!s) return;
      const h = HOLD[decodeURIComponent(a.id.slice(2))];
      if (s.deep) a.querySelector('details.deep').open = true;
      const mid = a.querySelector('details.mid'); if (mid && s.mid != null) mid.open = s.mid;
      for (const [attr, val, box, fn] of [['tf', s.tf, '.tfBody', tfBody], ['pn', s.pn, '.pBody', probBody]]) {
        const btn = val && a.querySelector(`[data-${attr}="${val}"]`);
        if (!btn || btn.getAttribute('aria-pressed') === 'true') continue;
        btn.parentElement.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', b === btn));
        a.querySelector(box).innerHTML = fn(h, val);
      }
    });
    [...app.querySelectorAll('section details')].filter((x) => !x.closest('article')).forEach((x, i) => { if (outer[i] != null) x.open = outer[i]; });
    scrollTo(0, y);
  }
  async function pollLive() {
    if (!PW || document.visibilityState !== 'visible') return;
    try {
      const r = await fetch('live.json?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) return;
      const L = await decrypt((await r.json()).__enc, PW);
      if (L.at === liveAt || L.at <= A[ids[0]].d.at) return;  // 브리핑보다 오래된 실시간 파일은 쓰지 않는다
      liveAt = L.at;
      for (const h of A[ids[0]].d.hold) {
        const x = L.holds[h.name];
        if (x) { h.live = x; if (x.tf) h.tf = x.tf; } else delete h.live;  // 이번 파일에 없으면 실시간 값 지움
      }
      if (cur === ids[0]) rerender();
    } catch {}
  }
  // '자세히 보기'는 하나만 열리게(긴 카드가 여러 개 펼쳐져 스크롤이 길어지지 않게)
  app.addEventListener('toggle', (e) => {
    if (e.target.matches?.('details.deep') && e.target.open && e.target.closest('article')) {
      app.querySelectorAll('article details.deep[open]').forEach((x) => { if (x !== e.target) x.open = false; });
    }
  }, true);
  setInterval(pollLive, 120000);
  // 열어 둔 채로 장이 열리고 닫히면 기준 가격 표시가 따라 바뀌게 5분마다 다시 그린다
  let wasOpen = [marketOpen(true), marketOpen(false)].join();
  setInterval(() => {
    const now = [marketOpen(true), marketOpen(false)].join();
    if (now !== wasOpen && document.visibilityState === 'visible') { wasOpen = now; rerender(); }
  }, 300000);
  document.addEventListener('visibilitychange', pollLive);
  pollLive();

  // 성향 진단 답: 이 기기에만 저장하고 카드만 다시 그린다
  app.addEventListener('change', (e) => {
    if (!e.target.matches('#profile input[type=radio]')) return;
    const ans = QS.map((_, i) => { const x = app.querySelector(`input[name=q${i}]:checked`); return x ? +x.value : null; });
    try { localStorage.setItem('brief-profile', JSON.stringify(ans.every((x) => x != null) ? ans : ans.map((x) => x ?? -1))); } catch {}
    if (ans.every((x) => x != null)) { const box = document.getElementById('profile'); box.outerHTML = profileCard(A[cur].d); document.querySelector('#profile details').open = true; }
  });

  app.addEventListener('click', (e) => {
    const jump = e.target.closest('[data-jump]');
    if (jump) {  // '오늘 지켜볼 것' → 그 종목 카드로 가서 기준 가격 펼치기
      e.preventDefault();
      const card = document.getElementById('s-' + encodeURIComponent(jump.dataset.jump));
      if (card) { card.querySelector('details.mid').open = true; card.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' }); }
      return;
    }
    const tf = e.target.closest('[data-tf]'), pn = e.target.closest('[data-pn]');
    if (tf || pn) {
      const btn = tf || pn, card = btn.closest('article'), h = HOLD[btn.dataset.name];
      btn.parentElement.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', b === btn));
      if (tf) card.querySelector('.tfBody').innerHTML = tfBody(h, tf.dataset.tf);
      else card.querySelector('.pBody').innerHTML = probBody(h, pn.dataset.pn);
      return;
    }
    const day = e.target.closest('.day'), o = e.target.closest('[data-o]');
    if (day) { cur = day.dataset.id; history.replaceState(null, '', '#' + cur); render(); scrollTo({ top: 0 }); }
    if (o) { order = o.dataset.o; render(); }
  });
  if (ids.length) render(); else app.innerHTML = '<p class="foot">아직 브리핑이 없습니다.</p>';
})();
</script>
</body>
</html>
