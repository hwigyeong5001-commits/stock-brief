<title>내 주식 관망</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 기준 폭 390px, 간격 4·8·12·16·24·32만. 카드는 면 차이로 구분, 포인트 색은 라임 하나(채움 전용).
   등락은 국내 관례(빨강↑ 파랑↓)+부호. 다크가 기본, 밝은 화면 설정이면 밝은 판. */
:root {
  --bg: #0e0f0d; --card: #181a17; --card2: #22251f; --line: #2c2f29;
  --ink: #f2f4ee; --mute: #a2a89c; --dim: #747a70;
  --lime: #cdf54a; --lime-ink: #12150a; --mark: #cdf54a; --ma20: #cdf54a; --ma60: #8f958a;
  --up: #ff6161; --dn: #6a9cff; --res: #ff8f8f; --sup: #8fb4ff;
  --ease: cubic-bezier(.22, 1, .36, 1);
  color-scheme: dark;
}
/* 항상 다크(사용자 요청) — 휴대폰이 밝은 모드여도 같은 화면 */
* { box-sizing: border-box; margin: 0; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  font-size: 14px; line-height: 1.57; word-break: keep-all; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 600px; margin: 0 auto; padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 32px max(16px, env(safe-area-inset-left)); display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.card > *, .stocks > * { min-width: 0; }
.up { color: var(--up); } .dn { color: var(--dn); } .eq { color: var(--mute); }

/* 상단 */
.top { display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
.brand { font-weight: 800; letter-spacing: -.03em; font-size: 17px; display: flex; align-items: center; gap: 8px; }
.brand::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--mark); }
.stamp { color: var(--mute); font-size: 12px; }
.days { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px 4px; scroll-snap-type: x proximity; }
.days::-webkit-scrollbar { display: none; }
.day { flex: none; min-height: 44px; scroll-snap-align: start; border: 1px solid var(--line); background: var(--card); color: var(--mute); border-radius: 999px;
  padding: 0 16px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: background .25s var(--ease), color .25s var(--ease); }
.day[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* 공통 */
.card { background: var(--card); border-radius: 18px; padding: 16px; display: grid; gap: 12px; }
.label { color: var(--mute); font-size: 12px; font-weight: 600; letter-spacing: .01em; }
.sec { display: flex; align-items: center; justify-content: space-between; padding: 16px 0 0; min-height: 44px; }
.h2 { font-size: 18px; font-weight: 750; letter-spacing: -.03em; }
.h2 small { color: var(--dim); font-size: 12px; font-weight: 500; margin-left: 6px; letter-spacing: 0; }
.chip { display: inline-block; border-radius: 999px; padding: 4px 10px; background: var(--card2); font-size: 12px; font-weight: 500; color: var(--mute); }
.chip b { color: var(--ink); font-weight: 650; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip.warn { background: none; border: 1px solid var(--mark); color: var(--ink); }

/* 헤드라인 + 계좌 */
.headline { font-size: 20px; font-weight: 750; letter-spacing: -.04em; line-height: 1.35; text-wrap: balance; }
.hero { padding: 20px 16px 16px; position: relative; overflow: hidden; }
.hero .arrow { position: absolute; top: 12px; right: 12px; width: 44px; height: 44px; border-radius: 50%; background: var(--lime); color: var(--lime-ink); display: grid; place-items: center; }
.hero .arrow svg { width: 20px; height: 20px; }
.big { font-size: 40px; font-weight: 750; letter-spacing: -.05em; line-height: 1; }
.big small { font-size: 18px; font-weight: 600; margin-left: 2px; }
.kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.kv div { background: var(--card2); border-radius: 12px; padding: 8px 12px; }
.kv span { display: block; color: var(--mute); font-size: 11px; }
.kv b { font-size: 14px; font-weight: 700; }
.spark svg { width: 100%; height: 56px; display: block; overflow: visible; }

/* 종목 카드 */
.toggle { display: inline-flex; background: var(--card); border-radius: 999px; padding: 2px; }
.toggle button { min-height: 40px; border: 0; background: none; color: var(--mute); font: inherit; font-size: 12px; font-weight: 650; padding: 0 12px; border-radius: 999px; cursor: pointer; transition: background .25s var(--ease), color .25s var(--ease); }
.toggle button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.stocks { display: grid; gap: 12px; }
.sHead { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: baseline; }
.sName { font-size: 17px; font-weight: 750; letter-spacing: -.03em; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.tone { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--card2); color: var(--mute); }
.tone.good { background: var(--lime); color: var(--lime-ink); }
.tone.bad { background: color-mix(in srgb, var(--up) 16%, transparent); color: var(--up); }
.sChg { font-size: 21px; font-weight: 700; letter-spacing: -.03em; text-align: right; }
.sMeta, .sPnl { color: var(--mute); font-size: 12px; }
.sMeta { grid-column: 1 / -1; }
.liveDot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--mark); margin: 0 4px 1px 2px; }
@media (prefers-reduced-motion: no-preference) { .liveDot { animation: blink 1.6s ease-in-out infinite; } @keyframes blink { 50% { opacity: .25; } } }
.sPrice { font-size: 14px; color: var(--mute); } .sPrice b { color: var(--ink); font-size: 16px; font-weight: 750; } .sPrice span { font-size: 12px; }
.sPnl { text-align: right; } .sPnl b { font-weight: 700; }
.chart svg { width: 100%; height: auto; display: block; }
.chart text { font: 600 10px "Pretendard Variable", sans-serif; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11px; color: var(--mute); }
.legend i { display: inline-block; width: 12px; height: 2px; vertical-align: middle; margin-right: 4px; border-radius: 2px; }
.gauge { display: grid; grid-template-columns: 40px 1fr 72px; gap: 8px; align-items: center; font-size: 12px; color: var(--mute); }
.gbar { position: relative; height: 6px; border-radius: 6px; background: linear-gradient(90deg, color-mix(in srgb, var(--dn) 55%, transparent) 0 30%, var(--card2) 30% 70%, color-mix(in srgb, var(--up) 55%, transparent) 70%); }
.gbar i { position: absolute; top: 50%; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 3px var(--card); }
.gauge b { color: var(--ink); font-weight: 700; text-align: right; }
.sub { font-size: 12px; font-weight: 700; color: var(--dim); }
.read { font-size: 14px; line-height: 1.6; }
.simple { font-size: 15px; font-weight: 650; line-height: 1.5; background: var(--card2); border-radius: 12px; padding: 12px; }
.simple::before { content: "한 줄로 보면"; display: block; font-size: 11px; font-weight: 700; color: var(--dim); margin-bottom: 2px; }
.seg { display: inline-flex; background: var(--card2); border-radius: 999px; padding: 2px; }
.seg button { min-height: 36px; border: 0; background: none; color: var(--mute); font: inherit; font-size: 12px; font-weight: 650; padding: 0 12px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.tfHead { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.tfBody { display: grid; gap: 12px; }
.prob { display: grid; gap: 8px; }
.pRow { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 4px 10px; align-items: center; font-size: 12px; }
.pRow > span { color: var(--mute); }
.stack { display: flex; height: 24px; border-radius: 8px; overflow: hidden; background: var(--card2); font-size: 11px; font-weight: 700; }
.stack i { display: flex; align-items: center; justify-content: center; font-style: normal; min-width: 0; white-space: nowrap; overflow: hidden; transition: flex-basis .4s var(--ease); }
.stack .u { background: color-mix(in srgb, var(--up) 70%, transparent); color: #fff; }
.stack .b { background: var(--line); color: var(--ink); }
.stack .d { background: color-mix(in srgb, var(--dn) 70%, transparent); color: #fff; }
.pKey { display: grid; gap: 4px; font-size: 13px; }
.pKey div { display: grid; grid-template-columns: 14px 1fr auto; gap: 8px; align-items: baseline; }
.pKey i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.pKey b { font-weight: 750; }
.pNote { font-size: 12px; color: var(--dim); line-height: 1.55; }
.pRow.dim .stack { opacity: .45; } .pRow small { font-size: 10px; color: var(--dim); }
.watchTop { display: grid; gap: 8px; }
.wt { display: grid; gap: 4px; min-height: 88px; background: var(--card); border-radius: 18px; padding: 14px 16px; color: var(--ink); text-decoration: none;
  box-shadow: inset 3px 0 0 var(--mark); }
.wt b { font-size: 15px; } .wt > span { font-size: 14px; color: var(--mute); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
details.mid > summary { min-height: 44px; cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 650; color: var(--mute); }
details.mid > summary::-webkit-details-marker { display: none; }
details.mid > summary::after { content: "+"; color: var(--mark); font-size: 18px; transition: transform .2s var(--ease); }
details.mid[open] > summary::after { transform: rotate(45deg); }
details.mid > div { display: grid; gap: 12px; }
.keys { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.keyNow { grid-column: 1 / -1; font-size: 13px; color: var(--mute); }
.closed { grid-column: 1 / -1; font-size: 13px; color: var(--mute); background: var(--card2); border-radius: 12px; padding: 12px; }
.key { border-radius: 14px; padding: 12px; display: grid; gap: 2px; background: var(--card2); min-height: 84px; }
.key small { font-size: 12px; color: var(--dim); }
.key span { font-size: 12px; color: var(--mute); line-height: 1.4; }
.key strong { font-size: 23px; font-weight: 800; letter-spacing: -.03em; }
.oneProb small { font-size: 12px; color: var(--dim); }
.stack { height: 18px !important; border-radius: 6px !important; }
.key.u span b { color: var(--up); } .key.d span b { color: var(--dn); }
.key.u { box-shadow: inset 0 3px 0 var(--up); } .key.d { box-shadow: inset 0 3px 0 var(--dn); }
.oneProb { grid-column: 1 / -1; display: grid; gap: 6px; font-size: 12px; color: var(--mute); }
.opKey { display: flex; justify-content: space-between; font-weight: 650; }
details.deep { border-top: 1px solid #303630; }
details.deep summary { min-height: 48px; width: 100%; cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: center; gap: 6px;
  font-size: 14px; font-weight: 700; color: var(--ink); }
details.deep summary::-webkit-details-marker { display: none; }
details.deep summary::after { content: "↓"; color: var(--mark); transition: transform .25s var(--ease); }
details.deep[open] summary::after { transform: rotate(180deg); }
.deepBody { display: grid; gap: 12px; padding-top: 4px; }
.gloss dt { font-weight: 700; margin-top: 12px; } .gloss dt:first-child { margin-top: 0; }
.gloss dd { margin: 2px 0 0; color: var(--mute); font-size: 13px; line-height: 1.6; }
.scen { display: grid; gap: 4px; }
.sc { display: grid; grid-template-columns: 48px 1fr; gap: 8px; background: var(--card2); border-radius: 12px; padding: 8px 12px; font-size: 14px; line-height: 1.5; }
.sc span { font-size: 12px; font-weight: 750; padding-top: 1px; }
.sc.u span { color: var(--up); } .sc.b span { color: var(--mute); } .sc.d span { color: var(--dn); }
.watch { display: grid; grid-template-columns: 8px 1fr; gap: 12px; align-items: start; border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-size: 14px; }
.watch::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--mark); margin-top: 7px; }
details.more { border-top: 1px solid var(--line); padding-top: 4px; }
details.more summary { min-height: 40px; cursor: pointer; list-style: none; color: var(--mute); font-size: 13px; font-weight: 650; display: flex; align-items: center; justify-content: space-between; }
details.more summary::-webkit-details-marker { display: none; }
details.more summary::after { content: "+"; font-size: 18px; font-weight: 500; transition: transform .25s var(--ease); }
details.more[open] summary::after { transform: rotate(45deg); }
details.more > div { display: grid; gap: 8px; padding-bottom: 4px; }
.risk { color: var(--mute); font-size: 13px; } .risk b { color: var(--ink); }

/* 시장 */
.flow { font-size: 14px; line-height: 1.65; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.kpi { background: var(--card2); border-radius: 12px; padding: 8px 12px; min-width: 0; }
.kpi .n { color: var(--mute); font-size: 11px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .v { font-size: 15px; font-weight: 700; letter-spacing: -.02em; display: block; }
.kpi .c { font-size: 12px; font-weight: 650; }
.bars { display: grid; gap: 8px; }
.bar { display: grid; grid-template-columns: 64px minmax(0, 1fr) 56px; gap: 8px; align-items: center; font-size: 13px; }
.track { position: relative; height: 20px; border-radius: 6px; background: var(--card2); }
.track::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; border-left: 1px dashed var(--dim); }
.track i { position: absolute; top: 4px; bottom: 4px; border-radius: 4px; }
.bar .c { text-align: right; font-weight: 650; }
.points { display: grid; gap: 8px; list-style: none; padding: 0; }
.points li { background: var(--card2); border-radius: 12px; padding: 12px; }
.pick { background: var(--lime); color: var(--lime-ink); border-radius: 12px; padding: 12px; font-weight: 650; }
.ev { display: grid; grid-template-columns: 56px 1fr; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.ev:first-of-type { border-top: 0; padding-top: 0; }
.ev .t { font-weight: 750; }
.ev .w { color: var(--mute); font-size: 12px; }
.src { display: grid; }
.src a { color: var(--mute); text-decoration: none; padding: 12px 24px 12px 0; border-top: 1px solid var(--line); position: relative; font-size: 13px; }
.src a::after { content: "↗"; position: absolute; right: 0; top: 12px; transition: transform .25s var(--ease); }
.src a:hover::after { transform: translate(2px, -2px); }
.foot { color: var(--dim); font-size: 12px; line-height: 1.6; padding-top: 8px; }

/* 모션: 첫 화면은 정지. 아래 카드만 스크롤해 들어올 때 한 번 올라온다(.motion-ready가 붙어야 숨김 → JS 없어도 보임) */
@media (prefers-reduced-motion: no-preference) {
  .motion-ready .rv { opacity: 0; transform: translateY(12px); transition: opacity .5s var(--ease), transform .5s var(--ease); }
  .motion-ready .rv.in { opacity: 1; transform: none; }
}
.lock { display: grid; gap: 12px; max-width: 360px; margin: 18vh auto 0; }
.lockT { color: var(--mute); }
.lockL { font-size: 12px; font-weight: 650; color: var(--mute); }
.lock input[type=password] { min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-size: 16px; padding: 0 14px; }
.lockR { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--mute); min-height: 44px; }
.lock button { min-height: 48px; border: 0; border-radius: 12px; background: var(--lime); color: var(--lime-ink); font: inherit; font-size: 15px; font-weight: 750; cursor: pointer; }
.lockE { color: var(--up); font-size: 13px; min-height: 1em; }
button:focus-visible, summary:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--mark); outline-offset: 2px; }
</style>

async function decrypt(e, pw) {
  const b = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b(e.salt), iterations: e.iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b(e.iv) }, key, b(e.ct))));
}
let PW = null;  // 푼 비밀번호 — 실시간 파일(live.json)도 같은 비밀번호로 푼다
function unlock(e) {
  const KEY = 'brief-pw';
  const app = document.getElementById('app');
  return new Promise(async (done) => {
    let saved = null;
    try { saved = localStorage.getItem(KEY); } catch {}
    if (saved) { try { const d = await decrypt(e, saved); PW = saved; return done(d); } catch { try { localStorage.removeItem(KEY); } catch {} } }
    app.innerHTML = `<form class="lock" id="lock">
      <div class="brand">내 주식 관망</div>
      <p class="lockT">내 계좌 정보가 들어 있어 잠겨 있어요.</p>
      <label class="lockL" for="pw">비밀번호</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <label class="lockR"><input id="remember" type="checkbox" checked> 이 기기에서 기억하기</label>
      <button type="submit">열기</button>
      <p class="lockE" id="lockE" role="alert"></p></form>`;
    const form = document.getElementById('lock');
    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const pw = document.getElementById('pw').value;
      form.querySelector('button').textContent = '여는 중…';
      try {
        const data = await decrypt(e, pw);
        PW = pw;
        if (document.getElementById('remember').checked) { try { localStorage.setItem(KEY, pw); } catch {} }
        done(data);
      } catch {
        document.getElementById('lockE').textContent = '비밀번호가 맞지 않아요.';
        form.querySelector('button').textContent = '열기';
      }
    });
  });
}

  // 스크롤해 들어오는 카드만 한 번 올라온다
  let io;
  function reveal() {
    if (reduce || !('IntersectionObserver' in window)) return;
    document.documentElement.classList.add('motion-ready');
    io?.disconnect();
    io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { rootMargin: '0px 0px -8% 0px' });
    app.querySelectorAll('.rv').forEach((el) => io.observe(el));
  }

  // 실시간: 장중 10분마다 PC가 올리는 live.json을 2분마다 확인해 최신 브리핑의 현재가·분봉만 바꾼다
  let liveAt = null;
  function rerender() {
    const st = {};
    app.querySelectorAll('article[id^="s-"]').forEach((a) => {
      st[a.id] = { deep: a.querySelector('details.deep')?.open, mid: a.querySelector('details.mid')?.open,
        tf: a.querySelector('[data-tf][aria-pressed="true"]')?.dataset.tf, pn: a.querySelector('[data-pn][aria-pressed="true"]')?.dataset.pn };
    });
    const outer = [...app.querySelectorAll('section details')].filter((x) => !x.closest('article')).map((x) => x.open);  // 시장 섹션 등
    const y = scrollY;
    render();
    app.querySelectorAll('.rv').forEach((el) => el.classList.add('in'));  // 다시 그릴 땐 등장 효과 없이
    app.querySelectorAll('article[id^="s-"]').forEach((a) => {
      const s = st[a.id]; if (!s) return;
      const h = HOLD[decodeURIComponent(a.id.slice(2))];
      if (s.deep) a.querySelector('details.deep').open = true;
      const mid = a.querySelector('details.mid'); if (mid && s.mid != null) mid.open = s.mid;
      for (const [attr, val, box, fn] of [['tf', s.tf, '.tfBody', tfBody], ['pn', s.pn, '.pBody', probBody]]) {
        const btn = val && a.querySelector(`[data-${attr}="${val}"]`);
        if (!btn || btn.getAttribute('aria-pressed') === 'true') continue;
        btn.parentElement.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', b === btn));
        a.querySelector(box).innerHTML = fn(h, val);
      }
    });
    [...app.querySelectorAll('section details')].filter((x) => !x.closest('article')).forEach((x, i) => { if (outer[i] != null) x.open = outer[i]; });
    scrollTo(0, y);
  }
  async function pollLive() {
    if (!PW || document.visibilityState !== 'visible') return;
    try {
      const r = await fetch('live.json?t=' + Date.now(), { cache: 'no-store' });
      if (!r.ok) return;
      const L = await decrypt((await r.json()).__enc, PW);
      if (L.at === liveAt || L.at <= A[ids[0]].d.at) return;  // 브리핑보다 오래된 실시간 파일은 쓰지 않는다
      liveAt = L.at;
      for (const h of A[ids[0]].d.hold) {
        const x = L.holds[h.name];
        if (x) { h.live = x; if (x.tf) h.tf = x.tf; } else delete h.live;  // 이번 파일에 없으면 실시간 값 지움
      }
      if (cur === ids[0]) rerender();
    } catch {}
  }
  // '자세히 보기'는 하나만 열리게(긴 카드가 여러 개 펼쳐져 스크롤이 길어지지 않게)
  app.addEventListener('toggle', (e) => {
    if (e.target.matches?.('details.deep') && e.target.open && e.target.closest('article')) {
      app.querySelectorAll('article details.deep[open]').forEach((x) => { if (x !== e.target) x.open = false; });
    }
  }, true);
  setInterval(pollLive, 120000);
  // 열어 둔 채로 장이 열리고 닫히면 기준 가격 표시가 따라 바뀌게 5분마다 다시 그린다
  let wasOpen = [marketOpen(true), marketOpen(false)].join();
  setInterval(() => {
    const now = [marketOpen(true), marketOpen(false)].join();
    if (now !== wasOpen && document.visibilityState === 'visible') { wasOpen = now; rerender(); }
  }, 300000);
  document.addEventListener('visibilitychange', pollLive);
  pollLive();

  app.addEventListener('click', (e) => {
    const jump = e.target.closest('[data-jump]');
    if (jump) {  // '오늘 지켜볼 것' → 그 종목 카드로 가서 기준 가격 펼치기
      e.preventDefault();
      const card = document.getElementById('s-' + encodeURIComponent(jump.dataset.jump));
      if (card) { card.querySelector('details.mid').open = true; card.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' }); }
      return;
    }
    const tf = e.target.closest('[data-tf]'), pn = e.target.closest('[data-pn]');
    if (tf || pn) {
      const btn = tf || pn, card = btn.closest('article'), h = HOLD[btn.dataset.name];
      btn.parentElement.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', b === btn));
      if (tf) card.querySelector('.tfBody').innerHTML = tfBody(h, tf.dataset.tf);
      else card.querySelector('.pBody').innerHTML = probBody(h, pn.dataset.pn);
      return;
    }
    const day = e.target.closest('.day'), o = e.target.closest('[data-o]');
    if (day) { cur = day.dataset.id; history.replaceState(null, '', '#' + cur); render(); scrollTo({ top: 0 }); }
    if (o) { order = o.dataset.o; render(); }
  });
  if (ids.length) render(); else app.innerHTML = '<p class="foot">아직 브리핑이 없습니다.</p>';
})();
</script>
</body>
</html>
